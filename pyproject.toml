[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capability-eval"
version = "0.1.0"
description = "Auditable, fixed-version capability cost evaluation for research agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
model = ["torch==2.8.0", "transformers==4.56.2", "peft==0.17.1"]
inspect = ["inspect-ai==0.3.139"]
device = ["nvidia-ml-py>=12,<14"]
science = ["numpy==1.26.4", "pandas==1.5.3", "scikit-learn==1.3.2", "scipy==1.11.4"]
official-bcb = ["numpy==1.26.4", "pyarrow==19.0.1"]

[project.scripts]
capability-eval = "capability_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capability_eval = ["schemas/*.json"]
